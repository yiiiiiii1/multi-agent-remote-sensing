<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" width="1280" height="720">
<title>四、Key advantages</title>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect x="72" y="56" width="48" height="4" fill="#0E8A7D"/>
<text x="72" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#16202A" font-weight="700">它的优势不是多了一层检测</text>
<rect x="72" y="196" width="4" height="150" fill="#0E8A7D"/>
<text x="100" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#16202A" font-weight="700">优势一　把「超出当前上下文」的预测信息喂给现有检测器</text>
<text x="100" y="272" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#1F2933" font-weight="400">现有检测器只看当前这一段；SSH 交给它的是一棵推测出来的未来树。</text>
<rect x="72" y="392" width="4" height="186" fill="#0E8A7D"/>
<text x="100" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#16202A" font-weight="700">优势二　判断依据从单个节点，变成整棵树的趋势</text>
<text x="100" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#1F2933" font-weight="400">跟判一个孤立节点相比，推测树提供更强的决策冗余：</text>
<text x="100" y="504" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#1F2933" font-weight="400">一个节点判错不要紧，多个判断互相兜底——</text>
<text x="100" y="542" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#0E8A7D" font-weight="700">所以降低了对单个检测器绝对精度的依赖。</text>
<rect x="72" y="604" width="1136" height="44" fill="#F4F6F7" rx="6"/>
<text x="96" y="633" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6B75" font-weight="400">支撑：PromptGuard 单独 12.25% ASR、Judger 单独 10.48%，加 SSH 都变 0%；连 86M 的 PromptGuard 也能做到。</text>
<line x1="72" y1="664" x2="1208" y2="664" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400">四、Key advantages</text>
<text x="1208" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400" text-anchor="end">07 / 09</text>
</svg>
