<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
<title>目录</title>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect x="72" y="56" width="48" height="4" fill="#0E8A7D"/>
<text x="72" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#16202A" font-weight="700">这篇论文的论证顺序</text>
<rect x="72" y="192" width="1136" height="68" fill="#F4F6F7" rx="4"/>
<rect x="72" y="192" width="4" height="68" fill="#C2410C"/>
<text x="98" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400">核心研究问题</text>
<text x="98" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#16202A" font-weight="700">现有防御只能回看历史——能不能在 Agent 动手之前，就预判它要做什么？</text>
<rect x="72" y="292" width="254" height="168" fill="#F4F6F7" rx="4"/>
<rect x="72" y="292" width="254" height="3" fill="#0E8A7D"/>
<text x="92" y="332" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#0E8A7D" font-weight="700">01</text>
<text x="92" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#16202A" font-weight="700">两类威胁</text>
<text x="92" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">一个坏人装成用户，</text>
<text x="92" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">一个藏在读到的数据里</text>
<text x="92" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400">P03</text>
<rect x="366" y="292" width="254" height="168" fill="#F4F6F7" rx="4"/>
<rect x="366" y="292" width="254" height="3" fill="#0E8A7D"/>
<text x="386" y="332" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#0E8A7D" font-weight="700">02</text>
<text x="386" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#16202A" font-weight="700">两个问题</text>
<text x="386" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">只防当前上下文；</text>
<text x="386" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">严格与宽松之间没有免费的解</text>
<text x="386" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400">P04</text>
<rect x="660" y="292" width="254" height="168" fill="#F4F6F7" rx="4"/>
<rect x="660" y="292" width="254" height="3" fill="#0E8A7D"/>
<text x="680" y="332" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#0E8A7D" font-weight="700">03</text>
<text x="680" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#16202A" font-weight="700">方法 A·B·C</text>
<text x="680" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">系统与训练 · 推测 · 验证</text>
<text x="680" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">三块各管一段流程</text>
<text x="680" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400">P05–P07</text>
<rect x="954" y="292" width="254" height="168" fill="#F4F6F7" rx="4"/>
<rect x="954" y="292" width="254" height="3" fill="#0E8A7D"/>
<text x="974" y="332" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#0E8A7D" font-weight="700">04</text>
<text x="974" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#16202A" font-weight="700">Key advantages</text>
<text x="974" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">给检测器未来的信息；</text>
<text x="974" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933" font-weight="400">靠决策冗余兜底</text>
<text x="974" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400">P08</text>
<rect x="72" y="496" width="1136" height="78" fill="#F4F6F7" rx="4"/>
<rect x="72" y="496" width="4" height="78" fill="#C2410C"/>
<text x="98" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#16202A" font-weight="700">证据与边界</text>
<text x="98" y="552" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933" font-weight="400">三张表（防得住 / 灵不灵 / 伤不伤）+ 两张结果图 + 两条局限 + 一个前提</text>
<text x="1120" y="552" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400" text-anchor="end">P09–P11</text>
<line x1="72" y1="596" x2="1208" y2="596" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="628" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#0E8A7D" font-weight="700">一句话：从「回看历史」改成「动手前推演」。</text>
<line x1="72" y1="664" x2="1208" y2="664" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400">目录</text>
<text x="1208" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400" text-anchor="end">02 / 11</text>
