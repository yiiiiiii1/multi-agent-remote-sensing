<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<title>证据</title>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect x="72" y="56" width="48" height="4" fill="#0E8A7D"/>
<text x="72" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#16202A" font-weight="700">先证明防得住，再证明不乱报</text>
<rect x="72" y="192" width="1136" height="44" fill="#16202A" rx="4"/>
<text x="88" y="221" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">实验</text>
<text x="258" y="221" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">基准</text>
<text x="558" y="221" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">回答什么</text>
<text x="778" y="221" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">关键数字</text>
<rect x="72" y="236" width="1136" height="64" fill="#FFFFFF"/>
<text x="88" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">防间接注入</text>
<text x="258" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">AgentDojo（629 用例）</text>
<text x="558" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">能不能防住</text>
<text x="778" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#C2410C" font-weight="700">ASR 0%</text>
<rect x="72" y="300" width="1136" height="64" fill="#F4F6F7"/>
<text x="88" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">防多轮越狱</text>
<text x="258" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">ActorAttack（1,200 目标）</text>
<text x="558" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">灵敏度够不够</text>
<text x="778" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#C2410C" font-weight="700">暴露率 99.5% / 96.0%</text>
<rect x="72" y="364" width="1136" height="64" fill="#FFFFFF"/>
<text x="88" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">不伤功能</text>
<text x="258" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">BFCL-v3 · XSTest</text>
<text x="558" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">代价多大</text>
<text x="778" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#C2410C" font-weight="700">45.13 → 44.88；拒答 0%</text>
<line x1="72" y1="428" x2="1208" y2="428" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="464" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#16202A" font-weight="700">四个数字</text>
<text x="72" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#0E8A7D" font-weight="700">0%</text>
<text x="72" y="568" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5E6B75" font-weight="400">加 SSH 后的攻击成功率</text>
<text x="360" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#0E8A7D" font-weight="700">99.5% / 96.0%</text>
<text x="360" y="568" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5E6B75" font-weight="400">M=5 暴露率</text>
<text x="360" y="592" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5E6B75" font-weight="400">HarmBench / Circuit Breaker</text>
<text x="648" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#C2410C" font-weight="700">0.2%</text>
<text x="648" y="568" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5E6B75" font-weight="400">系统级误报率</text>
<text x="936" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#C2410C" font-weight="700">1.3%</text>
<text x="936" y="568" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5E6B75" font-weight="400">探子占 235B 主模型的参数比</text>
<line x1="72" y1="664" x2="1208" y2="664" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400">证据</text>
<text x="1208" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400" text-anchor="end">08 / 09</text>
</svg>
