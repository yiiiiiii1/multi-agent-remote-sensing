<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<title>证据与边界 · 代价</title>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect x="72" y="56" width="48" height="4" fill="#0E8A7D"/>
<text x="72" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#16202A" font-weight="700">代价：功能没掉，但它没报开销</text>
<text x="72" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#5E6B75" font-weight="400">Table 3 · BFCL-v3 与 XSTest</text>
<image href="../images/ssh-table3.png" x="72" y="212" width="560" height="112" preserveAspectRatio="xMidYMid meet"/>
<text x="72" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#0E8A7D" font-weight="700">Overall 45.13 → 44.88，拒答率前后都是 0。</text>
<text x="72" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E6B75" font-weight="400">据论文 Table 3 原表。它证明的是「没弄坏」，不是「有好处」。</text>
<rect x="676" y="196" width="532" height="192" fill="#EFF8F6" stroke="#0E8A7D" stroke-width="1" rx="6"/>
<text x="700" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#0E8A7D" font-weight="700">一个前提（论文未列为局限）</text>
<text x="700" y="264" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#16202A" font-weight="700">探子必须比主 Agent 更容易上当。</text>
<text x="700" y="296" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">这个「故意不设防」是它成立的前提，</text>
<text x="700" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">也是它的软肋——</text>
<text x="700" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#0E8A7D" font-weight="700">被带偏的能力，就是它的漏报边界。</text>
<line x1="72" y1="414" x2="1208" y2="414" stroke="#DDE2E6" stroke-width="1"/>
<rect x="72" y="430" width="4" height="80" fill="#C2410C"/>
<text x="98" y="456" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#16202A" font-weight="700">局限一　算力</text>
<text x="98" y="488" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">M=5 并发分支的显存与功耗不可忽略；参数只多 1.3%，但并发是实打实的。</text>
<text x="98" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#5E6B75" font-weight="400">它只用 vLLM 批处理与复用 KV cache 来压，没给量化数字。</text>
<rect x="72" y="546" width="4" height="80" fill="#C2410C"/>
<text x="98" y="572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#16202A" font-weight="700">局限二　误报</text>
<text x="98" y="604" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933" font-weight="400">系统级 FPR 0.2%；一次误报带 3–7 秒延迟，开放任务里边界很薄。</text>
<text x="98" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#5E6B75" font-weight="400">它自己承认可能需要人在回路。</text>
<line x1="72" y1="664" x2="1208" y2="664" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400">证据与边界 · 代价</text>
<text x="1208" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400" text-anchor="end">10 / 10</text>
</svg>
