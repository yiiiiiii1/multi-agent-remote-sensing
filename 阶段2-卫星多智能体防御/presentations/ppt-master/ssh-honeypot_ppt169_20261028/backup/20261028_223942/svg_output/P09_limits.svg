<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" width="1280" height="720">
<title>证据与边界</title>
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect x="72" y="56" width="48" height="4" fill="#0E8A7D"/>
<text x="72" y="118" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#16202A" font-weight="700">报警率 57% 对 0%，代价是算力和误报</text>
<image href="../images/ssh-fig3.png" x="72" y="190" width="470" height="247" preserveAspectRatio="xMidYMid meet"/>
<text x="72" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6B75" font-weight="400">论文 Fig. 3　柱子是风险分（左轴），虚线是告警率（右轴）</text>
<image href="../images/ssh-fig4.png" x="574" y="190" width="634" height="126" preserveAspectRatio="xMidYMid meet"/>
<text x="574" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6B75" font-weight="400">论文 Fig. 4　左侧比暴露率与命中率，最右为深度 2–5</text>
<text x="574" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#0E8A7D" font-weight="700">有攻击：57.2% / 81.5% 告警；正常任务：0% / 0%</text>
<text x="574" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933" font-weight="400">暴露率上 Beam Search 明显领先；命中率两者接近</text>
<text x="574" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933" font-weight="400">工具调用命中 47.2%，文本越狱仅 8%——靠多分支兜底</text>
<line x1="72" y1="470" x2="1208" y2="470" stroke="#DDE2E6" stroke-width="1"/>
<rect x="72" y="486" width="4" height="96" fill="#C2410C"/>
<text x="96" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#16202A" font-weight="700">局限一　算力</text>
<text x="96" y="544" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933" font-weight="400">M=5 并发分支的显存与功耗不可忽略；参数只多 1.3%，但并发是实打实的。</text>
<rect x="72" y="590" width="4" height="60" fill="#C2410C"/>
<text x="96" y="616" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#16202A" font-weight="700">局限二　误报</text>
<text x="96" y="648" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933" font-weight="400">系统级 FPR 0.2%；一次误报带 3–7 秒延迟，开放任务边界很薄。</text>
<line x1="72" y1="664" x2="1208" y2="664" stroke="#DDE2E6" stroke-width="1"/>
<text x="72" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400">证据与边界</text>
<text x="1208" y="686" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5E6B75" font-weight="400" text-anchor="end">09 / 09</text>
</svg>
